<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header class="heading">
      <img class="logo" src="icons/icon-48.png" alt="" width="28" height="28">
      <strong id="name">图片批量下载助手 for ChatGPT</strong>
      <a id="githubLink" class="icon-link" href="https://github.com/xin0907/gpt-image-batch-downloader" target="_blank" rel="noopener" aria-label="在 GitHub 查看源代码" title="在 GitHub 查看源代码">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </header>

    <section class="card">
      <div class="row">
        <span id="languageLabel" class="label">语言</span>
        <div class="segmented" role="group" aria-labelledby="languageLabel">
          <button id="zh" type="button" lang="zh-CN" aria-pressed="true">中文</button>
          <button id="en" type="button" lang="en" aria-pressed="false">English</button>
        </div>
      </div>
    </section>

    <details id="support" class="support">
      <summary>
        <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
        <span id="supportLabel">请作者喝杯咖啡</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </summary>
      <div class="support-body">
        <div id="codeOptions" class="segmented full" role="group" aria-label="赞赏方式">
          <button id="alipay" type="button" aria-pressed="true">支付宝</button>
          <button id="wechat" type="button" aria-pressed="false">微信</button>
        </div>
        <div class="qr">
          <img id="alipayImage" src="assets/alipay-qr.png" alt="支付宝赞赏码" width="168" height="168">
          <img id="wechatImage" src="assets/wechat-qr.png" alt="微信赞赏码" width="168" height="168" hidden>
        </div>
        <p id="supportHint" class="hint">扫码随意赞赏，完全自愿，不影响任何功能</p>
      </div>
    </details>

    <p id="status" role="status" hidden></p>
  </main>
</body>
</html>
